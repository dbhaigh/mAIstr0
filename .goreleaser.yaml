version: 2
project_name: maistr0

builds:
  - id: maistr0
    main: ./cmd/maistr0
    binary: maistr0
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/maistr0/maistr0/internal/version.Value={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Darwin builds use the cgo tray backend and are built natively by
# build/build-macos.sh on a macOS runner.
upx:
  - enabled: true
    ids:
      - maistr0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    compress: best
    lzma: true

archives:
  - id: binaries
    ids:
      - maistr0
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - changelog.md
      - SECURITY.md
      - docs/*.md
      - docs/*.json
      - docs/*.jsonl
      - examples/benchmark.json
      - packaging/systemd/maistr0.service

checksum:
  name_template: checksums.txt
  algorithm: sha256
