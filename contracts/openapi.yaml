openapi: 3.1.0
info:
  title: mAIstr0 HTTP API
  version: 1.0.0
  description: >-
    HTTP routes exposed by both the orchestrator and node agent. Server-specific
    route registrations are listed in x-maistr0-registered-routes and checked
    against the Go mux registration source by contracts/contracts_test.go.
    Node engine configuration accepts an optional api_key for bearer
    authentication; that secret is write-only and is never returned by APIs.
servers:
  - url: https://localhost:7450
    description: Orchestrator
  - url: http://localhost:7451
    description: Node agent
paths:
  /:
    get:
      responses: {"200": {description: Embedded dashboard or static asset}}
  /status:
    get:
      responses: {"200": {description: Node health status}}
  /execute:
    post:
      responses: {"200": {description: Execute a subtask}}
  /stage/load:
    post:
      description: Load a contiguous model stage on this node; cluster requests require the existing trusted mTLS identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StageAssignment"}
      responses:
        "200": {description: Stage loaded}
        "400": {description: Invalid stage assignment}
        "404": {description: Model is unavailable on this node}
        "409": {description: Conflicting stage assignment}
        "501": {description: Selected engine does not support stages}
        "502": {description: Local stage engine failed to load the stage}
  /stage/open:
    post:
      description: Open request-local state (including stage-local KV cache) for a protocol-v2 pipeline request.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PipelineStageControlRequest"}
      responses:
        "200": {description: Stage request opened}
        "400": {description: Invalid control request}
        "404": {description: Stage is not loaded}
        "409": {description: Stage capacity is unavailable or request conflicts}
        "501": {description: Engine does not support protocol-v2 stages}
  /stage/prefill:
    post:
      description: Prefill a protocol-v2 stage. Request metadata is encoded in a length-prefixed binary envelope; activation tensor bytes follow its JSON header.
      requestBody:
        required: true
        content:
          application/vnd.maistr0.pipeline-stage-v2:
            schema: {type: string, format: binary}
            x-maistr0-header-schema: {$ref: "#/components/schemas/PipelineStageMessage"}
      responses:
        "200":
          description: Prefill result in the same binary envelope format
          content:
            application/vnd.maistr0.pipeline-stage-v2:
              schema: {type: string, format: binary}
              x-maistr0-header-schema: {$ref: "#/components/schemas/PipelineStageMessage"}
        "400": {description: Invalid prefill message}
        "404": {description: Stage request is not open}
        "502": {description: Stage inference failed}
  /stage/decode:
    post:
      description: Execute one token decode step using request-local KV state and the previous stage activation.
      requestBody:
        required: true
        content:
          application/vnd.maistr0.pipeline-stage-v2:
            schema: {type: string, format: binary}
            x-maistr0-header-schema: {$ref: "#/components/schemas/PipelineStageMessage"}
      responses:
        "200":
          description: Decode result in the same binary envelope format
          content:
            application/vnd.maistr0.pipeline-stage-v2:
              schema: {type: string, format: binary}
              x-maistr0-header-schema: {$ref: "#/components/schemas/PipelineStageMessage"}
        "400": {description: Invalid decode message}
        "404": {description: Stage request is not open}
        "502": {description: Stage inference failed}
  /stage/close:
    post:
      description: Release request-local KV state and the stage capacity slot.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PipelineStageControlRequest"}
      responses:
        "200": {description: Stage request closed}
        "400": {description: Invalid control request}
        "404": {description: Stage request is not open}
  /stage/forward:
    post:
      description: Stream a prompt or activation through a loaded stage. Non-final stages return activation frames; final stages return text-token frames. Cluster requests require the existing trusted mTLS identity.
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: {$ref: "#/components/schemas/StageForwardFrame"}
      responses:
        "200":
          description: Newline-delimited activation or token frames followed by completion or error
          content:
            application/x-ndjson:
              schema: {$ref: "#/components/schemas/StageForwardFrame"}
        "400": {description: Invalid forward stream}
        "404": {description: Stage is not loaded}
        "409": {description: Stage is unavailable or assignment conflicts}
  /stage/unload:
    post:
      description: Unload a contiguous model stage from this node; cluster requests require the existing trusted mTLS identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StageAssignment"}
      responses:
        "200": {description: Stage unloaded}
        "400": {description: Invalid stage assignment}
        "404": {description: Stage is not loaded}
        "409": {description: Stage is currently unavailable}
        "502": {description: Local stage engine failed to unload the stage}
  /generate:
    post:
      responses: {"200": {description: Generate text on the node}}
  /chat:
    post:
      responses: {"200": {description: Chat on the node}}
  /proxy/{path...}:
    post:
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
      responses: {"200": {description: Proxy an allowlisted provider request to the selected local engine}}
  /dialogues:
    get:
      responses: {"200": {description: List dialogues}}
    post:
      responses: {"200": {description: Create a dialogue}}
  /dialogues/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a dialogue}}
    delete:
      responses: {"200": {description: Delete a dialogue}}
  /dialogues/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Add a dialogue message}}
  /dialogues/{id}/chat:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Send a dialogue chat turn}}
  /dialogues/{id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Interrupt a dialogue}}
  /dialogues/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Cancel a dialogue}}
  /models:
    get:
      responses: {"200": {description: List configured models}}
    patch:
      responses: {"200": {description: Update configured models}}
  /models/all:
    get:
      responses: {"200": {description: List all available models}}
  /models/refresh:
    post:
      responses: {"200": {description: Refresh model inventory}}
  /models/pull:
    post:
      responses: {"200": {description: Pull a model}}
  /engine:
    get:
      responses: {"200": {description: Get engine information}}
  /properties:
    get:
      responses: {"200": {description: Get node properties}}
    patch:
      responses: {"200": {description: Update node properties}}
  /peers:
    get:
      responses: {"200": {description: List known peers}}
  /submit:
    post:
      responses: {"200": {description: Submit work to the orchestrator}}
  /tasks:
    get:
      description: >
        Protocol v3 sync requests may receive 204 with watermarks when no task
        changes are available. Gzip is negotiated with Accept-Encoding.
      responses:
        "200": {description: List tasks or task-sync data}
        "204": {description: No task changes for a protocol v3 sync request}
    post:
      responses: {"200": {description: Create a task}}
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a task}}
  /tasks/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Cancel a task}}
  /tasks/sync:
    post:
      responses: {"204": {description: Synchronize task history}}
  /tasks/replica:
    post:
      responses: {"204": {description: Apply a task replica}}
  /memory/sync:
    get:
      description: >
        Protocol v3 sync requests may receive 204 with watermarks when no
        memory changes are available. Gzip is negotiated with Accept-Encoding.
      responses:
        "200": {description: Get peer memory sync data}
        "204": {description: No memory changes for a protocol v3 sync request}
    post:
      responses: {"204": {description: Apply peer memory sync data}}
  /peer/message:
    post:
      responses: {"200": {description: Handle a peer message}}
  /peer/converse:
    post:
      responses: {"200": {description: Converse with a peer}}
  /memory/experiences:
    get:
      responses: {"200": {description: List memory experiences}}
  /memory/insights:
    get:
      responses: {"200": {description: Get memory insights}}
  /memory/facts:
    get:
      responses: {"200": {description: List memory facts}}
    post:
      responses: {"200": {description: Store a memory fact}}
  /api/version:
    get:
      responses: {"200": {description: Get API version}}
  /api/status:
    get:
      responses: {"200": {description: Get node or cluster status}}
  /api/metrics:
    get:
      responses: {"200": {description: Prometheus-format operational metrics}}
  /metrics:
    get:
      responses: {"200": {description: Prometheus text-format operational metrics}}
  /api/cluster/health:
    get:
      responses:
        "200":
          description: Get the shared cluster capacity and readiness view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterHealth"}
  /api/pairing/join:
    post:
      responses: {"200": {description: Join a cluster}}
  /api/pairing/status:
    get:
      responses: {"200": {description: Get pairing status}}
  /api/pairing/pin:
    post:
      responses: {"200": {description: Regenerate the pairing PIN}}
  /api/pairing/connect:
    post:
      description: Connect this node to an orchestrator. When orchestrator_id is supplied, it must identify a currently discovered orchestrator at the supplied HTTPS address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: {type: string, format: uri, description: Orchestrator HTTPS address}
                pin: {type: string, description: Optional one-use PIN for cross-subnet pairing}
                orchestrator_id: {type: string, description: Stable identity of the selected discovered orchestrator}
      responses:
        "200": {description: Connected to the orchestrator}
        "409": {description: Selected orchestrator is no longer discovered}
  /api/pairing/roster:
    get:
      responses: {"200": {description: Get the pairing roster}}
  /api/pairing/invitation:
    get:
      responses: {"200": {description: Get invitation status}}
    post:
      responses: {"200": {description: Create a pairing invitation}}
  /api/pairing/invitation/accept:
    post:
      responses: {"200": {description: Accept an invitation}}
  /api/pairing/invitation/reject:
    post:
      responses: {"200": {description: Reject an invitation}}
  /api/nodes:
    get:
      responses: {"200": {description: List cluster nodes}}
  /api/nodes/all:
    get:
      responses: {"200": {description: List all cluster nodes}}
  /api/nodes/register:
    post:
      responses: {"200": {description: Register a node}}
  /api/nodes/models/refresh:
    post:
      responses: {"200": {description: Refresh models on all nodes}}
  /api/nodes/{id}/eject:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Eject a node}}
  /api/nodes/{id}/models:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get node models}}
    patch:
      responses: {"200": {description: Update node models}}
  /api/nodes/{id}/pairing/connect:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Pair with a node}}
  /api/nodes/{id}/properties:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get node properties}}
    patch:
      responses: {"200": {description: Update node properties}}
  /api/nodes/{id}/engines:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: List node engines}}
  /api/shards:
    get:
      summary: List shard groups
      responses:
        "200":
          description: Persisted shard groups and current lifecycle states
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShardGroupList"}
        "503": {description: Shard-group persistence is unavailable}
    post:
      summary: Plan and start a shard group
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateShardGroupRequest"}
      responses:
        "201":
          description: Shard group is ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShardGroup"}
        "400": {description: Invalid model profile, mode, or placement}
        "409": {description: A group for the model already exists or an operation is active}
        "502": {description: A managed member could not be started or persisted}
        "503": {description: Required members or shard-group persistence are unavailable}
  /api/shards/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get a shard group
      responses:
        "200":
          description: Shard group details, plan rationale, and member status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShardGroup"}
        "404": {description: Shard group does not exist}
        "503": {description: Shard-group persistence is unavailable}
    delete:
      summary: Stop and remove a shard group
      responses:
        "204": {description: Shard group stopped and removed}
        "404": {description: Shard group does not exist}
        "409": {description: A shard-group operation is already active}
        "502": {description: Member teardown or persisted group deletion failed}
        "503": {description: Shard-group persistence is unavailable}
  /api/engines/managed:
    get:
      summary: List managed engine process status
      description: Node-local status; requests require a pinned mTLS certificate for the current paired orchestrator.
      security:
        - PairedOrchestrator: []
      responses:
        "200":
          description: Managed engine status
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ManagedEngineStatus"}
        "403": {description: Request is not from the current paired orchestrator}
  /api/engines/managed/{id}/start:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Start a configured managed engine
      description: Launches the configured argv-only command and waits for readiness. ggml-rpc-server remains on loopback and is reached through pinned mTLS TCP relays. vLLM requires a private VLLM_HOST_IP on an operator-trusted interface, or the explicit allow_insecure_shard_network override, and is unsupported on native Windows.
      security:
        - PairedOrchestrator: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManagedEngineStartRequest"}
      responses:
        "200": {description: Engine is ready}
        "400": {description: Invalid request, shard plan, or untrusted vLLM network preflight}
        "403": {description: Request is not from the current paired orchestrator}
        "404": {description: Managed engine is not configured}
        "502": {description: Engine or authenticated RPC relay failed to start}
        "501": {description: Engine is unsupported on this platform}
        "504": {description: Engine readiness timed out}
  /api/engines/managed/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Stop a managed engine
      description: Stops the configured process tree. Requests require a pinned mTLS certificate for the current paired orchestrator.
      security:
        - PairedOrchestrator: []
      responses:
        "200": {description: Engine is stopped}
        "403": {description: Request is not from the current paired orchestrator}
        "404": {description: Managed engine is not configured}
        "504": {description: Engine did not stop before the request deadline}
  /api/engines/managed/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Restart a managed engine
      description: Stops and restarts the configured process with bounded exponential backoff. vLLM requires shard_plan and is unsupported on native Windows.
      security:
        - PairedOrchestrator: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManagedEngineStartRequest"}
      responses:
        "200": {description: Engine is ready}
        "400": {description: Invalid request or shard plan}
        "403": {description: Request is not from the current paired orchestrator}
        "404": {description: Managed engine is not configured}
        "501": {description: Engine is unsupported on this platform}
        "502": {description: Engine failed to restart}
        "504": {description: Engine readiness or shutdown timed out}
  /api/engines/managed/{id}/proxy/{path...}:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Proxy an inference request to a ready managed engine
      description: Node-local inference proxy; requests require a pinned mTLS certificate for the current paired orchestrator.
      security:
        - PairedOrchestrator: []
      responses:
        "403": {description: Request is not from the current paired orchestrator}
        "503": {description: Managed engine is not ready}
        "502": {description: Managed engine request failed}
  /api/nodes/{id}/models/refresh:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Refresh node models}}
  /api/nodes/{id}/models/pull:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Pull a model on a node}}
  /api/nodes/{id}/generate:
    parameters:
      - $ref: "#/components/parameters/ID"
      - in: header
        name: Idempotency-Key
        required: false
        description: Optional worker-local result replay key for non-streaming generation.
        schema:
          type: string
          minLength: 1
          maxLength: 200
    post:
      responses: {"200": {description: Generate text on a node}}
  /api/nodes/{id}/chat:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Chat with a node}}
  /api/nodes/{id}/dialogues:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Proxy dialogue listing to a node}}
    post:
      responses: {"200": {description: Proxy dialogue creation to a node}}
  /api/nodes/{id}/dialogues/:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Proxy nested dialogue routes to a node}}
    post:
      responses: {"200": {description: Proxy nested dialogue routes to a node}}
  /api/nodes/{id}/models/{model}/generate:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Model"
      - in: header
        name: Idempotency-Key
        required: false
        description: Optional worker-local result replay key for non-streaming generation.
        schema:
          type: string
          minLength: 1
          maxLength: 200
    post:
      responses: {"200": {description: Generate with a node model}}
  /api/nodes/{id}/models/{model}/test:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Model"
    post:
      responses: {"200": {description: Test a node model}}
  /api/nodes/{id}/peer-converse:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Broker a node-to-node conversation}}
  /api/discovery:
    get:
      responses: {"200": {description: List discovered instances}}
  /api/discovery/{id}/pairing/invite:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Invite a discovered instance}}
  /api/events:
    get:
      responses:
        "200":
          description: >-
            Subscribe to server events. Each JSON snapshot additively includes
            cluster_health using the same view model as GET /api/cluster/health,
            model_inventory entries identifying whole and sharded models, and
            pipeline_plans with stage health and live transfer/utilization data
            as described by DashboardPipelineSnapshot. Router events and
            per-node/model circuit-breaker states are also included.
  /api/pipelines/{model_id}/reshard:
    parameters:
      - name: model_id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Recompute a sharded-model placement and load its stages
      responses:
        "200":
          description: Placement and stage loading completed
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan:
                    $ref: "#/components/schemas/PipelinePlan"
        "404": {description: No sharded model is registered with this logical ID}
        "500": {description: Pipeline plan persistence failed}
        "502": {description: A stage failed to load}
        "503": {description: No complete placement or capacity is available}
  /api/router/requests:
    get:
      responses:
        "200":
          description: List recent prompt-free routing events and per-node/model circuit-breaker states
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RouterRequests"}
  /api/tasks:
    get:
      description: >
        Protocol v3 sync requests may receive 204 with watermarks when no task
        changes are available. Gzip is negotiated with Accept-Encoding.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string}
      responses:
        "200":
          description: List tasks; page_size or cursor opts in to the cursor envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/Task"}
                  - $ref: "#/components/schemas/TaskHistoryPage"
        "400": {description: Invalid page size or cursor}
        "413": {description: One task exceeds the 64 MiB page response limit}
        "204": {description: No task changes for a protocol v3 sync request}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: {type: string}
                subtasks:
                  type: array
                  items: {$ref: "#/components/schemas/Subtask"}
                graph: {$ref: "#/components/schemas/TaskGraph"}
                plan_mode:
                  type: string
                  enum: [auto, heuristic, heuristic_v1]
                  description: "auto asks a local coordinator model for a plan; heuristic uses local decomposition; heuristic_v1 preserves the legacy heuristic"
                routing_preference:
                  type: string
                  enum: [quality, latency]
                  description: "Candidate scoring preference applied to all subtasks; defaults to quality"
                require_review: {type: boolean}
                require_approval: {type: boolean}
              additionalProperties: true
      responses:
        "202": {description: Task accepted}
        "400": {description: Invalid task request}
        "502": {description: Planning model failed to produce a valid plan}
        "503": {description: No healthy node can accept the task}
  /api/tasks/resumable:
    get:
      responses: {"200": {description: List resumable tasks}}
  /api/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a task}}
  /api/tasks/{id}/dependencies:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses:
        "200":
          description: Get task dependency graph nodes and edges
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDependencies"}
        "404": {description: Task not found}
  /api/tasks/{id}/assignment-explanation:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses:
        "200":
          description: Explain the stored scheduler score for each task assignment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssignmentExplanation"}
        "404": {description: Task not found}
  /api/tasks/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Cancel a task}}
  /api/tasks/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Approve a task}}
  /api/tasks/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Resume a task}}
  /api/tasks/{id}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: List task checkpoints}}
  /api/dialogues:
    get:
      responses: {"200": {description: List dialogues}}
    post:
      responses: {"200": {description: Create a dialogue}}
  /api/dialogues/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a dialogue}}
    delete:
      responses: {"200": {description: Delete a dialogue}}
  /api/dialogues/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Add a dialogue message}}
  /api/dialogues/{id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/ID"
