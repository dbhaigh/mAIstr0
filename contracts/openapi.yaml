openapi: 3.1.0
info:
  title: mAIstr0 HTTP API
  version: 1.0.0
  description: >-
    HTTP routes exposed by both the orchestrator and node agent. Server-specific
    route registrations are listed in x-maistr0-registered-routes and checked
    against the Go mux registration source by contracts/contracts_test.go.
servers:
  - url: https://localhost:7450
    description: Orchestrator
  - url: http://localhost:7451
    description: Node agent
paths:
  /:
    get:
      responses: {"200": {description: Embedded dashboard or static asset}}
  /status:
    get:
      responses: {"200": {description: Node health status}}
  /execute:
    post:
      responses: {"200": {description: Execute a subtask}}
  /generate:
    post:
      responses: {"200": {description: Generate text on the node}}
  /chat:
    post:
      responses: {"200": {description: Chat on the node}}
  /proxy/{path...}:
    post:
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
      responses: {"200": {description: Proxy an allowlisted provider request to the selected local engine}}
  /dialogues:
    get:
      responses: {"200": {description: List dialogues}}
    post:
      responses: {"200": {description: Create a dialogue}}
  /dialogues/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a dialogue}}
    delete:
      responses: {"200": {description: Delete a dialogue}}
  /dialogues/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Add a dialogue message}}
  /dialogues/{id}/chat:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Send a dialogue chat turn}}
  /dialogues/{id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Interrupt a dialogue}}
  /dialogues/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Cancel a dialogue}}
  /models:
    get:
      responses: {"200": {description: List configured models}}
    patch:
      responses: {"200": {description: Update configured models}}
  /models/all:
    get:
      responses: {"200": {description: List all available models}}
  /models/refresh:
    post:
      responses: {"200": {description: Refresh model inventory}}
  /models/pull:
    post:
      responses: {"200": {description: Pull a model}}
  /engine:
    get:
      responses: {"200": {description: Get engine information}}
  /properties:
    get:
      responses: {"200": {description: Get node properties}}
    patch:
      responses: {"200": {description: Update node properties}}
  /peers:
    get:
      responses: {"200": {description: List known peers}}
  /submit:
    post:
      responses: {"200": {description: Submit work to the orchestrator}}
  /tasks:
    get:
      responses: {"200": {description: List tasks}}
    post:
      responses: {"200": {description: Create a task}}
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a task}}
  /tasks/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Cancel a task}}
  /tasks/sync:
    post:
      responses: {"200": {description: Synchronize task history}}
  /tasks/replica:
    post:
      responses: {"200": {description: Apply a task replica}}
  /memory/sync:
    get:
      responses: {"200": {description: Get peer memory sync data}}
    post:
      responses: {"200": {description: Apply peer memory sync data}}
  /peer/message:
    post:
      responses: {"200": {description: Handle a peer message}}
  /peer/converse:
    post:
      responses: {"200": {description: Converse with a peer}}
  /memory/experiences:
    get:
      responses: {"200": {description: List memory experiences}}
  /memory/insights:
    get:
      responses: {"200": {description: Get memory insights}}
  /memory/facts:
    get:
      responses: {"200": {description: List memory facts}}
    post:
      responses: {"200": {description: Store a memory fact}}
  /api/version:
    get:
      responses: {"200": {description: Get API version}}
  /api/status:
    get:
      responses: {"200": {description: Get node or cluster status}}
  /api/metrics:
    get:
      responses: {"200": {description: Prometheus-format operational metrics}}
  /metrics:
    get:
      responses: {"200": {description: Prometheus text-format operational metrics}}
  /api/cluster/health:
    get:
      responses:
        "200":
          description: Get the shared cluster capacity and readiness view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterHealth"}
  /api/pairing/join:
    post:
      responses: {"200": {description: Join a cluster}}
  /api/pairing/status:
    get:
      responses: {"200": {description: Get pairing status}}
  /api/pairing/pin:
    post:
      responses: {"200": {description: Regenerate the pairing PIN}}
  /api/pairing/connect:
    post:
      description: Connect this node to an orchestrator. When orchestrator_id is supplied, it must identify a currently discovered orchestrator at the supplied HTTPS address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: {type: string, format: uri, description: Orchestrator HTTPS address}
                pin: {type: string, description: Optional one-use PIN for cross-subnet pairing}
                orchestrator_id: {type: string, description: Stable identity of the selected discovered orchestrator}
      responses:
        "200": {description: Connected to the orchestrator}
        "409": {description: Selected orchestrator is no longer discovered}
  /api/pairing/roster:
    get:
      responses: {"200": {description: Get the pairing roster}}
  /api/pairing/invitation:
    get:
      responses: {"200": {description: Get invitation status}}
    post:
      responses: {"200": {description: Create a pairing invitation}}
  /api/pairing/invitation/accept:
    post:
      responses: {"200": {description: Accept an invitation}}
  /api/pairing/invitation/reject:
    post:
      responses: {"200": {description: Reject an invitation}}
  /api/nodes:
    get:
      responses: {"200": {description: List cluster nodes}}
  /api/nodes/all:
    get:
      responses: {"200": {description: List all cluster nodes}}
  /api/nodes/register:
    post:
      responses: {"200": {description: Register a node}}
  /api/nodes/models/refresh:
    post:
      responses: {"200": {description: Refresh models on all nodes}}
  /api/nodes/{id}/eject:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Eject a node}}
  /api/nodes/{id}/models:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get node models}}
    patch:
      responses: {"200": {description: Update node models}}
  /api/nodes/{id}/pairing/connect:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Pair with a node}}
  /api/nodes/{id}/properties:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get node properties}}
    patch:
      responses: {"200": {description: Update node properties}}
  /api/nodes/{id}/engines:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: List node engines}}
  /api/nodes/{id}/models/refresh:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Refresh node models}}
  /api/nodes/{id}/models/pull:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Pull a model on a node}}
  /api/nodes/{id}/generate:
    parameters:
      - $ref: "#/components/parameters/ID"
      - in: header
        name: Idempotency-Key
        required: false
        description: Optional worker-local result replay key for non-streaming generation.
        schema:
          type: string
          minLength: 1
          maxLength: 200
    post:
      responses: {"200": {description: Generate text on a node}}
  /api/nodes/{id}/chat:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Chat with a node}}
  /api/nodes/{id}/dialogues:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Proxy dialogue listing to a node}}
    post:
      responses: {"200": {description: Proxy dialogue creation to a node}}
  /api/nodes/{id}/dialogues/:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Proxy nested dialogue routes to a node}}
    post:
      responses: {"200": {description: Proxy nested dialogue routes to a node}}
  /api/nodes/{id}/models/{model}/generate:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Model"
      - in: header
        name: Idempotency-Key
        required: false
        description: Optional worker-local result replay key for non-streaming generation.
        schema:
          type: string
          minLength: 1
          maxLength: 200
    post:
      responses: {"200": {description: Generate with a node model}}
  /api/nodes/{id}/models/{model}/test:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Model"
    post:
      responses: {"200": {description: Test a node model}}
  /api/nodes/{id}/peer-converse:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Broker a node-to-node conversation}}
  /api/discovery:
    get:
      responses: {"200": {description: List discovered instances}}
  /api/discovery/{id}/pairing/invite:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Invite a discovered instance}}
  /api/events:
    get:
      responses:
        "200":
          description: >-
            Subscribe to server events. Each JSON snapshot additively includes
            cluster_health using the same view model as GET /api/cluster/health.
  /api/router/requests:
    get:
      responses: {"200": {description: List recent prompt-free inference routing events}}
  /api/tasks:
    get:
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string}
      responses:
        "200":
          description: List tasks; page_size or cursor opts in to the cursor envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/Task"}
                  - $ref: "#/components/schemas/TaskHistoryPage"
        "400": {description: Invalid page size or cursor}
        "413": {description: One task exceeds the 64 MiB page response limit}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: {type: string}
                subtasks:
                  type: array
                  items: {$ref: "#/components/schemas/Subtask"}
                graph: {$ref: "#/components/schemas/TaskGraph"}
                plan_mode: {type: string}
                require_review: {type: boolean}
                require_approval: {type: boolean}
              additionalProperties: true
      responses:
        "202": {description: Task accepted}
        "400": {description: Invalid task request}
        "502": {description: Planning model failed to produce a valid plan}
        "503": {description: No healthy node can accept the task}
  /api/tasks/resumable:
    get:
      responses: {"200": {description: List resumable tasks}}
  /api/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a task}}
  /api/tasks/{id}/dependencies:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses:
        "200":
          description: Get task dependency graph nodes and edges
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDependencies"}
        "404": {description: Task not found}
  /api/tasks/{id}/assignment-explanation:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses:
        "200":
          description: Explain the stored scheduler score for each task assignment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssignmentExplanation"}
        "404": {description: Task not found}
  /api/tasks/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Cancel a task}}
  /api/tasks/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Approve a task}}
  /api/tasks/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Resume a task}}
  /api/tasks/{id}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: List task checkpoints}}
  /api/dialogues:
    get:
      responses: {"200": {description: List dialogues}}
    post:
      responses: {"200": {description: Create a dialogue}}
  /api/dialogues/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a dialogue}}
    delete:
      responses: {"200": {description: Delete a dialogue}}
  /api/dialogues/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Add a dialogue message}}
  /api/dialogues/{id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Interrupt a dialogue}}
  /api/dialogues/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Cancel a dialogue}}
  /api/peer/converse:
    post:
      responses: {"200": {description: Converse with a peer}}
  /api/memory/experiences:
    get:
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          schema: {type: string}
        - name: task_type
          in: query
          schema: {type: string}
        - name: node_id
          in: query
          schema: {type: string}
        - name: model
          in: query
          schema: {type: string}
        - name: tool
          in: query
          schema: {type: string}
        - name: success_only
          in: query
          schema: {type: boolean}
      responses:
        "200":
          description: List memory experiences; page_size or cursor opts in to the cursor envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/Experience"}
                  - $ref: "#/components/schemas/ExperienceHistoryPage"
        "400": {description: Invalid page size, cursor, or success_only value}
        "413": {description: One experience exceeds the 64 MiB page response limit}
  /api/memory/insights:
    get:
      responses: {"200": {description: Get memory insights}}
  /api/memory/recommendations:
    get:
      responses: {"200": {description: Get memory recommendations}}
  /api/memory/facts:
    get:
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - name: scope
          in: query
          schema: {type: string}
      responses:
        "200":
          description: List memory facts; page_size or cursor opts in to the cursor envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/Fact"}
                  - $ref: "#/components/schemas/FactHistoryPage"
        "400": {description: Invalid page size or cursor}
        "413": {description: One fact exceeds the 64 MiB page response limit}
    post:
      responses: {"200": {description: Store a memory fact}}
  /api/memory/facts/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    delete:
      responses: {"200": {description: Delete a memory fact}}
  /api/memory/dialogues:
    get:
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List memory dialogues; page_size or cursor opts in to the cursor envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/DialogueRecord"}
                  - $ref: "#/components/schemas/DialogueHistoryPage"
        "400": {description: Invalid page size or cursor}
        "413": {description: One dialogue exceeds the 64 MiB page response limit}
  /api/memory/dialogues/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get a memory dialogue}}
  /api/memory/sync:
    get:
      responses: {"200": {description: Get memory synchronization data}}
    post:
      responses: {"200": {description: Apply memory synchronization data}}
  /api/memory/prune:
    post:
      responses: {"200": {description: Prune old memory records}}
  /api/agent/:
    get:
      responses: {"200": {description: Proxy agent API route}}
    post:
      responses: {"200": {description: Proxy agent API route}}
    patch:
      responses: {"200": {description: Proxy agent API route}}
    delete:
      responses: {"200": {description: Proxy agent API route}}
  /api/agent/sessions:
    get:
      responses: {"200": {description: List agent sessions}}
    post:
      responses: {"200": {description: Create an agent session}}
  /api/agent/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      responses: {"200": {description: Get an agent session}}
    delete:
      responses: {"200": {description: Delete an agent session}}
  /api/agent/sessions/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Send an agent message}}
  /api/agent/sessions/{id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Interrupt an agent session}}
  /api/agent/sessions/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      responses: {"200": {description: Cancel an agent session}}
  /api/agent/tools:
    get:
      responses: {"200": {description: List agent tools}}
  /api/agent/models:
    get:
      responses: {"200": {description: List agent models}}
  /api/agent/stats:
    get:
      responses: {"200": {description: Get agent statistics}}
  /api/agent/backend:
    get:
      responses: {"200": {description: Get agent backend}}
    patch:
      responses: {"200": {description: Update agent backend}}
  /api/models:
    get:
      responses: {"200": {description: List cluster models}}
  /api/generate:
    post:
      responses: {"200": {description: Generate text through the cluster}}
  /api/tags:
    get:
      responses: {"200": {description: List model tags}}
  /api/chat:
    post:
      responses: {"200": {description: Chat through the cluster}}
  /api/models/catalog:
    get:
      responses: {"200": {description: List model catalog}}
  /v1/models:
    get:
      responses: {"200": {description: OpenAI-compatible model list}}
  /v1/chat/completions:
    post:
      responses: {"200": {description: OpenAI-compatible chat completion}}
  /v1/completions:
    post:
      responses: {"200": {description: OpenAI-compatible completion}}
  /v1/messages:
    post:
      responses: {"200": {description: Anthropic-compatible message}}
  /router/{path...}:
    post:
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
      responses: {"200": {description: Transparent model-aware routing for an allowlisted provider request}}
  /router/v1/chat/completions:
    post:
      responses: {"200": {description: Route an OpenAI-compatible chat completion request}}
  /router/v1/completions:
    post:
      responses: {"200": {description: Route an OpenAI-compatible completion request}}
  /router/v1/messages:
    post:
      responses: {"200": {description: Route an Anthropic-compatible messages request}}
  /router/api/chat:
    post:
      responses: {"200": {description: Route an Ollama-compatible chat request}}
  /router/api/generate:
    post:
      responses: {"200": {description: Route an Ollama-compatible generate request}}
components:
  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      description: Opts into cursor paging; page sizes are from 1 through 100.
      schema: {type: integer, minimum: 1, maximum: 100}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token bound to the list resource and filters.
      schema: {type: string}
    ID:
      name: id
      in: path
      required: true
      schema: {type: string}
    Key:
      name: key
      in: path
      required: true
      schema: {type: string}
    Model:
      name: model
      in: path
      required: true
      schema: {type: string}
  schemas:
    NodeConfig:
      $ref: "./schemas/node-config.schema.json"
    OrchestratorConfig:
      $ref: "./schemas/orchestrator-config.schema.json"
    Task:
      $ref: "./schemas/task.schema.json"
    SubtaskResult:
      $ref: "./schemas/subtask-result.schema.json"
    Subtask:
      $ref: "./schemas/subtask.schema.json"
    TaskGraph:
      $ref: "./schemas/task-graph.schema.json"
    TaskDependencies:
      $ref: "./schemas/task-dependencies.schema.json"
    Assignment:
      $ref: "./schemas/assignment.schema.json"
    ScoreFactors:
      $ref: "./schemas/score-factors.schema.json"
    AssignmentExplanation:
      $ref: "./schemas/assignment-explanation.schema.json"
    NodeStatus:
      $ref: "./schemas/node-status.schema.json"
    Announcement:
      $ref: "./schemas/announcement.schema.json"
    Experience:
      $ref: "./schemas/experience.schema.json"
    Fact:
      $ref: "./schemas/fact.schema.json"
    Performance:
      $ref: "./schemas/performance.schema.json"
    DialogueRecord:
      $ref: "./schemas/dialogue-record.schema.json"
    Snapshot:
      $ref: "./schemas/snapshot.schema.json"
    ClusterHealth:
      $ref: "./schemas/cluster-health.schema.json"
    DispatchAttempt:
      $ref: "./schemas/dispatch-attempt.schema.json"
    EngineStatus:
      $ref: "./schemas/engine-status.schema.json"
    RouterRequestEvent:
      $ref: "./schemas/router-request-event.schema.json"
    TaskHistoryPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        next_cursor: {type: string}
        has_more: {type: boolean}
      additionalProperties: false
    ExperienceHistoryPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Experience"}
        next_cursor: {type: string}
        has_more: {type: boolean}
      additionalProperties: false
    FactHistoryPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Fact"}
        next_cursor: {type: string}
        has_more: {type: boolean}
      additionalProperties: false
    DialogueHistoryPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/DialogueRecord"}
        next_cursor: {type: string}
        has_more: {type: boolean}
      additionalProperties: false
x-maistr0-registered-routes:
  - "orchestrator|POST /api/pairing/join"
  - "orchestrator|GET /api/pairing/status"
  - "orchestrator|GET /api/status"
  - "orchestrator|GET /api/metrics"
  - "orchestrator|GET /metrics"
  - "orchestrator|GET /api/cluster/health"
  - "orchestrator|POST /api/pairing/pin"
  - "orchestrator|POST /api/pairing/connect"
  - "orchestrator|GET /api/pairing/roster"
  - "orchestrator|POST /api/nodes/register"
  - "orchestrator|POST /api/nodes/{id}/eject"
  - "orchestrator|GET /api/nodes"
  - "orchestrator|GET /api/nodes/all"
