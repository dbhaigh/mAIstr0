components:
  securitySchemes:
    PairedOrchestrator:
      type: mutualTLS
      description: The node verifies the client certificate fingerprint, paired orchestrator role, and current election authority.
  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      description: Opts into cursor paging; page sizes are from 1 through 100.
      schema: {type: integer, minimum: 1, maximum: 100}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token bound to the list resource and filters.
      schema: {type: string}
    ID:
      name: id
      in: path
      required: true
      schema: {type: string}
    Key:
      name: key
      in: path
      required: true
      schema: {type: string}
    Model:
      name: model
      in: path
      required: true
      schema: {type: string}
  schemas:
    NodeConfig:
      description: Node configuration; configured engine api_key values are write-only.
      allOf:
        - $ref: "./schemas/node-config.schema.json"
        - type: object
          properties:
            engines:
              type: array
              items: {$ref: "#/components/schemas/EngineConfig"}
            managed_engines:
              type: array
              items: {$ref: "#/components/schemas/ManagedEngineConfig"}
            managed_engine_binary_allowlist:
              type: array
              items: {type: string}
            managed_engine_model_allowlist:
              type: array
              items: {type: string}
    EngineConfig:
      type: object
      required: [name, url]
      properties:
        name: {type: string}
        url: {type: string}
        registry_url: {type: string}
        validated_rpc:
          type: boolean
          default: false
          description: Operator-only opt-in after testing this engine's RPC sharding; engine self-reports do not enable NPU shard membership.
        api_key:
          type: string
          writeOnly: true
          description: Bearer token for supported OpenAI-compatible engines.
      additionalProperties: true
    ManagedEngineConfig:
      $ref: "./schemas/node-config.schema.json#/$defs/ManagedEngine"
    ManagedEngineStatus:
      $ref: "./schemas/managed-engine-status.schema.json"
    ManagedEngineStartRequest:
      $ref: "./schemas/managed-engine-start.schema.json"
    CreateShardGroupRequest:
      $ref: "./schemas/create-shard-group.schema.json"
    ShardModelProfile:
      $ref: "./schemas/shard-model-profile.schema.json"
    ShardPlan:
      $ref: "./schemas/shard-plan.schema.json"
    ShardGroup:
      $ref: "./schemas/shard-group.schema.json"
    ShardGroupList:
      $ref: "./schemas/shard-group-list.schema.json"
    OrchestratorConfig:
      $ref: "./schemas/orchestrator-config.schema.json"
    Task:
      $ref: "./schemas/task.schema.json"
    SubtaskResult:
      $ref: "./schemas/subtask-result.schema.json"
    Subtask:
      $ref: "./schemas/subtask.schema.json"
    TaskGraph:
      $ref: "./schemas/task-graph.schema.json"
    TaskDependencies:
      $ref: "./schemas/task-dependencies.schema.json"
    Assignment:
      $ref: "./schemas/assignment.schema.json"
    ScoreFactors:
      $ref: "./schemas/score-factors.schema.json"
    AssignmentExplanation:
      $ref: "./schemas/assignment-explanation.schema.json"
    NodeStatus:
      $ref: "./schemas/node-status.schema.json"
    StageAssignment:
      $ref: "./schemas/stage-assignment.schema.json"
    StageForwardFrame:
      $ref: "./schemas/stage-forward-frame.schema.json"
    ShardedModelConfig:
      $ref: "./schemas/sharded-model-config.schema.json"
    StageSpec:
      $ref: "./schemas/stage-spec.schema.json"
    PipelinePlan:
      $ref: "./schemas/pipeline-plan.schema.json"
    DashboardPipelineSnapshot:
      $ref: "./schemas/dashboard-pipeline.schema.json"
    Announcement:
      $ref: "./schemas/announcement.schema.json"
    Experience:
      $ref: "./schemas/experience.schema.json"
    Fact:
      $ref: "./schemas/fact.schema.json"
    Performance:
      $ref: "./schemas/performance.schema.json"
    DialogueRecord:
      $ref: "./schemas/dialogue-record.schema.json"
    Snapshot:
      $ref: "./schemas/snapshot.schema.json"
    ClusterHealth:
      $ref: "./schemas/cluster-health.schema.json"
    DispatchAttempt:
      $ref: "./schemas/dispatch-attempt.schema.json"
    EngineStatus:
      $ref: "./schemas/engine-status.schema.json"
    PipelineStageCapabilities:
      $ref: "./schemas/pipeline-stage-capabilities.schema.json"
    PipelineStageControlRequest:
      $ref: "./schemas/pipeline-stage-control.schema.json"
    PipelineStageRequest:
      $ref: "./schemas/pipeline-stage-request.schema.json"
    PipelineStageOutput:
      $ref: "./schemas/pipeline-stage-output.schema.json"
    ActivationTensor:
      $ref: "./schemas/activation-tensor.schema.json"
    PipelineStageMessage:
      $ref: "./schemas/pipeline-stage-message.schema.json"
    RouterRequestEvent:
      $ref: "./schemas/router-request-event.schema.json"
    RouterCircuitBreaker:
      $ref: "./schemas/router-circuit-breaker.schema.json"
    RouterRequests:
      $ref: "./schemas/router-requests.schema.json"
    TaskHistoryPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        next_cursor: {type: string}
