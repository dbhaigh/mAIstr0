name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  acceptance:
    name: Release acceptance
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  qualification:
    name: Full release qualification
    uses: ./.github/workflows/qualification.yml

  macos-build:
    name: Build unsigned macOS packages
    needs: [acceptance, qualification]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Verify release tag and build macOS packages
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^[[:space:]]*var Value = "\([^"]*\)".*/\1/p' internal/version/version.go)
          test "${GITHUB_REF_NAME#v}" = "$source_version"
          go test ./internal/selfupdate ./contracts -count=1 -timeout=180s
          bash build/build-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-packages
          path: dist/macos/${{ github.ref_name }}/*
          if-no-files-found: error

  release:
    name: Publish Windows, Linux, and macOS binaries
    needs: [acceptance, qualification, macos-build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Detect numeric iteration release
        id: version
        shell: bash
        run: |
          source_version=$(sed -n 's/^[[:space:]]*var Value = "\([^"]*\)".*/\1/p' internal/version/version.go)
          test "${GITHUB_REF_NAME#v}" = "$source_version"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "iteration=true" >> "$GITHUB_OUTPUT"
          else
            echo "iteration=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish semantic release
        if: steps.version.outputs.iteration != 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.15.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish numeric iteration release
        if: steps.version.outputs.iteration == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash build/build.sh
          mkdir -p dist/packages
          for target in windows-amd64 linux-amd64 linux-ubuntu-amd64; do
            os="${target%-amd64}"
            name="maistr0_${version}_${os}_amd64"
            folder="dist/packages/$name"
            mkdir -p "$folder/docs" "$folder/examples"
            cp LICENSE README.md changelog.md SECURITY.md "$folder/"
            cp docs/*.md docs/*.json docs/*.jsonl "$folder/docs/"
            cp examples/benchmark.json "$folder/examples/"
            cp dist/"$target"/maistr0* "$folder/"
            if [[ "$target" == windows-* ]]; then
              find "$folder" -exec touch -d "@$(git log -1 --format=%ct)" {} +
              (cd "$folder" && find . -type f | LC_ALL=C sort | zip -Xq "../$name.zip" -@)
            else
              tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
                -czf "dist/packages/$name.tar.gz" -C "$folder" .
            fi
          done
          (cd dist/packages && sha256sum *.zip *.tar.gz > checksums.txt)
          gh release create "$GITHUB_REF_NAME" dist/packages/*.zip dist/packages/*.tar.gz dist/packages/checksums.txt --verify-tag --generate-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-packages
          path: dist/packages/macos
      - name: Attach macOS release packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" dist/packages/macos/*.zip dist/packages/macos/*.tar.gz dist/packages/macos/checksums-darwin.txt --clobber
