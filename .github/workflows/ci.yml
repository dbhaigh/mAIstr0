name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check contract drift
        run: |
          go generate ./contracts ./internal/scheduler
          git diff --exit-code -- contracts/fixtures
          go test ./contracts
      - name: Run Go tests
        run: go test ./...
      - name: Run Go tests with race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Build application
        run: go build ./cmd/maistr0
      - name: Test dashboard
        run: node --test web/app_test.js
