name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Shared quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check generated contracts
        run: |
          go generate ./contracts ./internal/scheduler
          git diff --exit-code -- contracts/fixtures
          test -z "$(git ls-files --others --exclude-standard -- contracts/fixtures)"
      - name: Check dashboard bundle and tests
        run: |
          npm --prefix web ci
          npm --prefix web run build
          git diff --exit-code -- web/static
          test -z "$(git ls-files --others --exclude-standard -- web/static)"
          node --test web/app_test.js
          node --test build/benchmark-gate.test.mjs build/workflow-policy.test.mjs
      - name: Audit frontend build dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Static analysis
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          args: --timeout=5m
      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Validate workflow syntax and job dependencies
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -shellcheck= -pyflakes=
      - name: Review changed dependency vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate
          license-check: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Build and vet every package
        run: |
          go build ./...
          go vet ./...
      - name: Run fast tests including contract/schema validation
        run: go test -short -count=1 -timeout=120s ./...
      - name: Run short shuffled tests
        run: go test -short -shuffle=on -count=1 -timeout=120s ./...

  required:
    name: Required CI
    permissions: {}
    if: always()
    needs: [checks, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every PR gate to succeed
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TEST_RESULT" = success
