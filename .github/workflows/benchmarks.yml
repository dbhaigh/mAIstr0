name: Scheduled benchmarks

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Paired performance qualification (synthetic, no accelerators)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Prepare approved baseline
        shell: bash
        run: |
          baseline="$(node -p 'JSON.parse(require("fs").readFileSync("build/benchmark-gate.json")).baseline_commit')"
          git worktree add --detach "$RUNNER_TEMP/performance-baseline" "$baseline"
      - name: Qualify timing and allocation regressions
        shell: bash
        run: |
          node build/benchmark-gate.mjs build/benchmark-gate.json \
            "$RUNNER_TEMP/performance-baseline" "$PWD" "$RUNNER_TEMP/benchmark-results"
      - name: Record direct and single/multi-node routing
        shell: bash
        env:
          GOMAXPROCS: "2"
          MAISTR0_E2E_REQUESTS: "100"
          MAISTR0_BENCH_REVISION: ${{ github.sha }}
          MAISTR0_BENCH_DIRTY: "false"
        run: |
          export MAISTR0_E2E_REPORT="$RUNNER_TEMP/benchmark-results/end-to-end.json"
          go test ./internal/orchestrator -run '^TestEndToEndInferenceBenchmarks$' -count=1 -timeout=15m
      - name: Upload raw samples, comparison and environment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          retention-days: 90
          if-no-files-found: error
      - name: Remove isolated baseline checkout
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/performance-baseline" ]; then
            git worktree remove "$RUNNER_TEMP/performance-baseline"
          fi
